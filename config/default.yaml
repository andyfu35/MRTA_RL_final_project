seed: 42

environment:
  # Large deterministic 2D arena. Physics noise is intentionally disabled.
  width: 20.0
  height: 20.0
  dt: 0.10

  # Differential-drive kinematics.
  wheel_radius: 0.10
  wheel_base: 0.50
  max_wheel_speed: 6.0

  # Collision footprint + renderer dimensions.
  robot_radius: 0.30
  body_length: 0.70
  body_width: 0.44
  wheel_length: 0.34
  wheel_width: 0.10

  goal: [18.0, 10.0]
  goal_radius: 0.70
  max_steps: 360

  lidar_rays: 8
  lidar_range: 6.0
  reset_jitter: 0.18

  # Every environment generates its own random axis-aligned rectangular map.
  # A fixed seed reproduces the same maps exactly.
  obstacles:
    count: 14
    min_width: 0.8
    max_width: 1.8
    min_height: 0.8
    max_height: 1.8
    min_spacing: 0.65
    spawn_clearance: 1.8
    goal_clearance: 2.0
    border_margin: 0.35
    max_attempts: 4000

# Reward is intentionally unchanged for now. We will tune it separately.
reward:
  runner:
    goal_bonus: 100.0
    team_progress: 2.0
    self_progress: 0.5
    collision: -2.0
    step: -0.01
  blocker:
    runner_progress: -2.0
    timeout_bonus: 100.0
    goal_failure: -100.0
    collision: -2.0
    step: -0.005
    proximity: 0.02

training:
  samples_per_update: 1024
  rounds: 10
  checkpoint_every: 5

# Different machines may use different collection profiles, but every PPO
# update must collect exactly training.samples_per_update samples.
collection_profiles:
  runner_0:
    parallel_envs: 32
    rollout_steps: 32
    batches: 1
  runner_1:
    parallel_envs: 16
    rollout_steps: 32
    batches: 2
  blocker_0:
    parallel_envs: 8
    rollout_steps: 32
    batches: 4
  blocker_1:
    parallel_envs: 4
    rollout_steps: 32
    batches: 8

ppo:
  hidden_sizes: [64, 64]
  learning_rate: 0.0003
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  value_coef: 0.5
  entropy_coef: 0.005
  max_grad_norm: 0.5
  epochs: 4
  minibatch_size: 256

# Mock mode runs all four workers on one computer. ROS2 transport will replace
# this layer later without changing the trainer/worker contract.
network:
  mode: mock
  coordinator:
    ip: 127.0.0.1
    port: 7400
  agents:
    runner_0: {ip: 127.0.0.1, port: 7401}
    runner_1: {ip: 127.0.0.1, port: 7402}
    blocker_0: {ip: 127.0.0.1, port: 7403}
    blocker_1: {ip: 127.0.0.1, port: 7404}
