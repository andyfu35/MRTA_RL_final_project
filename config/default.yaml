seed: 42

environment:
  width: 10.0
  height: 6.0
  dt: 0.10
  wheel_radius: 0.10
  wheel_base: 0.40
  max_wheel_speed: 5.0
  robot_radius: 0.18
  goal: [9.0, 3.0]
  goal_radius: 0.50
  max_steps: 160
  lidar_rays: 8
  lidar_range: 4.0
  reset_jitter: 0.12
  obstacles:
    - [4.0, 1.35, 0.45]
    - [4.8, 3.00, 0.55]
    - [4.0, 4.65, 0.45]

reward:
  runner:
    goal_bonus: 100.0
    team_progress: 2.0
    self_progress: 0.5
    collision: -2.0
    step: -0.01
  blocker:
    runner_progress: -2.0
    timeout_bonus: 100.0
    goal_failure: -100.0
    collision: -2.0
    step: -0.005
    proximity: 0.02

training:
  samples_per_update: 1024
  rounds: 10
  checkpoint_every: 5

collection_profiles:
  runner_0:
    parallel_envs: 32
    rollout_steps: 32
    batches: 1
  runner_1:
    parallel_envs: 16
    rollout_steps: 32
    batches: 2
  blocker_0:
    parallel_envs: 8
    rollout_steps: 32
    batches: 4
  blocker_1:
    parallel_envs: 4
    rollout_steps: 32
    batches: 8

ppo:
  hidden_sizes: [64, 64]
  learning_rate: 0.0003
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  value_coef: 0.5
  entropy_coef: 0.005
  max_grad_norm: 0.5
  epochs: 4
  minibatch_size: 256

network:
  mode: mock
  coordinator:
    ip: 127.0.0.1
    port: 7400
  agents:
    runner_0: {ip: 127.0.0.1, port: 7401}
    runner_1: {ip: 127.0.0.1, port: 7402}
    blocker_0: {ip: 127.0.0.1, port: 7403}
    blocker_1: {ip: 127.0.0.1, port: 7404}
